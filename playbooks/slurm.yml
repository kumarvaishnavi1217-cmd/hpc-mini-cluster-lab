---
- name: Slurm controller + accounting
  hosts: slurm_controller
  roles:
    - slurmdbd           # DB must exist before slurmctld registers the cluster
    - slurm_controller

- name: Compute nodes
  hosts: compute
  roles:
    - slurm_compute
    - apptainer

- name: Login nodes
  hosts: slurm_login
  roles:
    - slurm_login
    - apptainer
