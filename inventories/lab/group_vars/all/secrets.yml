---
# Indirection layer: roles reference these names; values come from vault.yml
# (encrypted, git-ignored by convention). Defaults let CI syntax-check without secrets.
proxmox_api_password: "{{ vault_proxmox_api_password | default('UNSET') }}"
pbs_password: "{{ vault_pbs_password | default('UNSET') }}"
pbs_fingerprint: "{{ vault_pbs_fingerprint | default('UNSET') }}"
slurmdbd_db_password: "{{ vault_slurmdbd_db_password | default('UNSET') }}"
grafana_admin_password: "{{ vault_grafana_admin_password | default('UNSET') }}"
munge_key_b64: "{{ vault_munge_key_b64 | default('') }}"
rgw_s3_access_key: "{{ vault_rgw_s3_access_key | default('UNSET') }}"
rgw_s3_secret_key: "{{ vault_rgw_s3_secret_key | default('UNSET') }}"
wireguard_hub_private_key: "{{ vault_wireguard_hub_private_key | default('') }}"
