---
# Lab inventory. Addressing plan (see docs/network.md):
#   VLAN 10 mgmt     10.10.10.0/24   VLAN 30 ceph public   10.10.30.0/24 (bond0, LACP)
#   VLAN 20 compute  10.10.20.0/24   VLAN 31 ceph cluster  10.10.31.0/24 (bond0, LACP)
#   VLAN 50 corosync 10.10.50.0/24   WireGuard             10.200.0.0/24
all:
  children:
    proxmox:
      hosts:
        pve01: { ansible_host: 10.10.10.11, corosync_ip: 10.10.50.11 }
        pve02: { ansible_host: 10.10.10.12, corosync_ip: 10.10.50.12 }
        pve03: { ansible_host: 10.10.10.13, corosync_ip: 10.10.50.13 }
    pbs:
      hosts:
        pbs01: { ansible_host: 10.10.10.15 }

    # ---- Everything below is a Rocky Linux VM cloned from the golden image ----
    rocky:
      children:
        mgmt_plane:
          children:
            slurm_controller:
              hosts:
                slurmctl01: { ansible_host: 10.10.10.21, compute_ip: 10.10.20.21, ceph_public_ip: 10.10.30.21, vmid: 201, pve_node: pve01 }
            slurm_login:
              hosts:
                login01: { ansible_host: 10.10.10.22, compute_ip: 10.10.20.22, ceph_public_ip: 10.10.30.22, vmid: 202, pve_node: pve02 }
            monitoring:
              hosts:
                monitor01: { ansible_host: 10.10.10.23, compute_ip: 10.10.20.23, vmid: 203, pve_node: pve03 }
        ceph:
          hosts:
            ceph01: { ansible_host: 10.10.10.31, ceph_public_ip: 10.10.30.31, ceph_cluster_ip: 10.10.31.31, vmid: 231, pve_node: pve01 }
            ceph02: { ansible_host: 10.10.10.32, ceph_public_ip: 10.10.30.32, ceph_cluster_ip: 10.10.31.32, vmid: 232, pve_node: pve02 }
            ceph03: { ansible_host: 10.10.10.33, ceph_public_ip: 10.10.30.33, ceph_cluster_ip: 10.10.31.33, vmid: 233, pve_node: pve03 }
        compute:
          children:
            compute_cpu:
              hosts:
                compute01: { ansible_host: 10.10.10.101, compute_ip: 10.10.20.101, ceph_public_ip: 10.10.30.101, vmid: 301, pve_node: pve01 }
                compute02: { ansible_host: 10.10.10.102, compute_ip: 10.10.20.102, ceph_public_ip: 10.10.30.102, vmid: 302, pve_node: pve02 }
                compute03: { ansible_host: 10.10.10.103, compute_ip: 10.10.20.103, ceph_public_ip: 10.10.30.103, vmid: 303, pve_node: pve03 }
            compute_gpu:
              hosts:
                gpu01:
                  ansible_host: 10.10.10.111
                  compute_ip: 10.10.20.111
                  ceph_public_ip: 10.10.30.111
                  vmid: 311
                  pve_node: pve01
                  pci_passthrough: "0000:41:00.0"   # GPU passed through from pve01

    # Convenience groups
    ceph_clients:
      children:
        compute:
        slurm_login:
        slurm_controller:
    slurm_cluster:
      children:
        slurm_controller:
        slurm_login:
        compute:
    wireguard_hub:
      hosts:
        login01:
    # Staged roll-out: CI applies changes to `canary` first, then to everything.
    canary:
      hosts:
        compute01:
        login01:
