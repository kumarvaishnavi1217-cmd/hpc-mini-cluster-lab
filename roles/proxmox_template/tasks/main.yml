---
# Builds the golden image once, on the first node. Every Rocky VM is a full clone.
- name: Check whether golden template already exists
  ansible.builtin.command: qm config {{ pve_template_vmid }}
  register: pve_tpl
  failed_when: false
  changed_when: false

- name: Build golden template
  when: pve_tpl.rc != 0
  block:
    - name: Install libguestfs-tools for image customisation
      ansible.builtin.apt:
        name: libguestfs-tools
        state: present

    - name: Download Rocky Linux 9 GenericCloud image
      ansible.builtin.get_url:
        url: "{{ rocky_cloud_image_url }}"
        dest: "{{ pve_template_image_path }}"
        mode: "0644"

    - name: Bake qemu-guest-agent and python3 into the image
      ansible.builtin.command: >
        virt-customize -a {{ pve_template_image_path }}
        --install qemu-guest-agent,python3,cloud-utils-growpart
        --run-command 'systemctl enable qemu-guest-agent'
        --run-command 'truncate -s0 /etc/machine-id'
        --selinux-relabel
      changed_when: true

    - name: Create template VM shell
      ansible.builtin.command: >
        qm create {{ pve_template_vmid }} --name {{ pve_template_name }}
        --memory 2048 --cores 2 --cpu host --machine q35
        --net0 virtio,bridge={{ pve_template_bridge }}
        --scsihw virtio-scsi-single --agent enabled=1
        --serial0 socket --vga serial0 --ostype l26
      changed_when: true

    - name: Import disk and attach cloud-init drive
      ansible.builtin.shell: |
        set -euo pipefail
        qm set {{ pve_template_vmid }} --scsi0 {{ pve_storage }}:0,import-from={{ pve_template_image_path }},discard=on,ssd=1
        qm set {{ pve_template_vmid }} --ide2 {{ pve_storage }}:cloudinit --boot order=scsi0
        qm set {{ pve_template_vmid }} --ciuser ansible --sshkeys /root/.ssh/authorized_keys
        qm set {{ pve_template_vmid }} --ipconfig0 ip=dhcp
      args:
        executable: /bin/bash
      changed_when: true

    - name: Convert to template
      ansible.builtin.command: qm template {{ pve_template_vmid }}
      changed_when: true
