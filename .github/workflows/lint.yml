name: lint
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ansible-core ansible-lint yamllint
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml -p ./collections
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint --profile production
      - name: Syntax check
        run: for p in playbooks/*.yml; do ansible-playbook --syntax-check "$p"; done
      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh tests/slurm-jobs/*.sh tests/slurm-jobs/*.sbatch
